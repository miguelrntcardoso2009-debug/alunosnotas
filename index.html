<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- Tela de login -->
    <section id="loginTela" class="card login">
        <h1>Sistema de Notas</h1>
        <p class="subtitulo">Entre como professor ou aluno.</p>

        <div id="mensagemLogin" class="mensagem erro escondido"></div>

        <form id="loginForm">
            <label for="tipo">Tipo de usuário</label>
            <select id="tipo" required>
                <option value="">Selecione</option>
                <option value="professor">Professor</option>
                <option value="aluno">Aluno</option>
            </select>

            <label for="usuario">Usuário</label>
            <input id="usuario" type="text" placeholder="Digite seu usuário" required>

            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="Digite sua senha" required>

            <button type="submit">Entrar</button>
        </form>

        <div class="dica">
            Professor: <strong>professor</strong> / <strong>123456</strong>
        </div>
    </section>


    <!-- Área do professor -->
    <section id="professorTela" class="escondido">
        <header class="topo">
            <div>
                <h1>Área do Professor</h1>
                <p>Cadastre alunos e suas notas finais.</p>
            </div>

            <button class="botao-sair" onclick="sair()">Sair</button>
        </header>

        <div id="mensagemProfessor" class="mensagem sucesso escondido"></div>

        <div class="grid">

            <div class="card">
                <h2>Cadastrar aluno</h2>

                <form id="cadastroForm">

                    <label for="novoNome">Nome do aluno</label>
                    <input id="novoNome" type="text" required>

                    <label for="novaSenha">Senha do aluno</label>
                    <input id="novaSenha" type="password" required>

                    <label for="novaNota">Nota final</label>
                    <input id="novaNota" type="number" min="0" max="10" step="0.01" required>

                    <button type="submit">Cadastrar</button>

                </form>
            </div>


            <div class="card">
                <h2>Alunos cadastrados</h2>

                <div id="listaAlunos"></div>
            </div>

        </div>
    </section>


    <!-- Área do aluno -->
    <section id="alunoTela" class="escondido">
        <header class="topo">
            <div>
                <h1>Área do Aluno</h1>
                <p id="nomeAluno"></p>
            </div>

            <button class="botao-sair" onclick="sair()">Sair</button>
        </header>

        <div class="card nota-card">
            <p>Sua nota final</p>
            <div id="notaAluno" class="nota">-</div>
        </div>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
